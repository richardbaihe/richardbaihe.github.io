# Profile
avatar: /assets/img/avatar.jpeg
bio: "Research Scientist at Apple MLR, building efficient and scalable foundation models for sequence modeling — powering real-time audio LLMs, reasoning LLMs, and knowledge & retrieval grounded LLMs."
education: >-
  I completed my PhD in Computer Science at the University of Waterloo,
  with a dissertation titled
  "<a href='https://uwspace.uwaterloo.ca/items/7f8262f0-325b-4623-8996-edcd8fdbd780'>Novel Methods for Natural Language Modeling and Pretraining</a>",
  under the supervision of Professor
  <a href='https://scholar.google.ca/citations?user=oGgPXFEAAAAJ&hl=en'>Ming Li</a>.
  Prior to my doctoral studies, I obtained a Master's degree from the Chinese Academy of Sciences,
  where I began my NLP research journey under the mentorship of Professor
  <a href='https://scholar.google.com.hk/citations?user=l8lvKOQAAAAJ&hl=en'>Chengqing Zong</a>.

