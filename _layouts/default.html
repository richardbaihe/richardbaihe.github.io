<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>{{ site.title }}</title>
  <meta name="author" content="{{ site.author }}">
  <meta name="description" content="{{ site.description }}">
  <link rel="shortcut icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.13.0/css/all.min.css">
</head>
<body>
  <header id="page_header">
    <div class="header_wrap">
      <div id="blog_name">
        <a class="blog_title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      <button class="menus_icon"><div class="navicon"></div></button>
      <ul class="menus_items">
        <li class="menus_item"><a class="site-page" href="#About">About Me</a></li>
        <li class="menus_item"><a class="site-page" href="#Publications">Publications</a></li>
      </ul>
    </div>
  </header>

  <main id="page_main">
    <div class="side-card sticky">
      <div class="card-wrap" itemscope itemtype="http://schema.org/Person">
        <div class="author-avatar">
          <img class="avatar-img" src="{{ '/assets/img/avatar.jpeg' | relative_url }}" alt="avatar">
        </div>
        <div class="author-discrip">
          <h3>{{ site.author }}</h3>
          <p class="author-bio"></p>
        </div>
        <div class="author-links">
          <button class="btn m-social-links">Links</button>
          <ul class="social-icons">
            <li><a class="social-icon" href="{{ site.social.twitter }}" target="_blank"><i class="fab fa-twitter" aria-hidden="true"></i></a></li>
            <li><a class="social-icon" href="{{ site.social.linkedin }}" target="_blank"><i class="fab fa-linkedin" aria-hidden="true"></i></a></li>
            <li><a class="social-icon" href="mailto:{{ site.social.email }}" target="_blank"><i class="fas fa-envelope" aria-hidden="true"></i></a></li>
          </ul>
          <ul class="social-links">
            <li><a class="e-social-link" href="{{ site.social.scholar }}" target="_blank"><i class="fas fa-graduation-cap" aria-hidden="true"></i><span>Google Scholar</span></a></li>
            <li><a class="e-social-link" href="{{ site.social.github }}" target="_blank"><i class="fab fa-github" aria-hidden="true"></i><span>Github</span></a></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="page" itemscope itemtype="http://schema.org/CreativeWork">
      <article>
        {{ content }}
      </article>
    </div>
  </main>

  <div class="nav-wrap">
    <div class="nav">
      <button class="site-nav"><div class="navicon"></div></button>
      <ul class="nav_items">
        <li class="nav_item"><a class="nav-page" href="#About">About Me</a></li>
        <li class="nav_item"><a class="nav-page" href="#Publications">Publications</a></li>
      </ul>
    </div>
    <div class="cd-top"><i class="fa fa-arrow-up" aria-hidden="true"></i></div>
  </div>

  <footer id="page_footer">
    <div class="footer_wrap">
      <div class="copyright">&copy;2020 - {{ 'now' | date: "%Y" }} by {{ site.author }}</div>
      <div class="theme-info">Powered by <a target="_blank" href="https://jekyllrb.com" rel="nofollow noopener">Jekyll</a></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@latest/dist/jquery.min.js"></script>
  <script>
    $(document).ready(function() {
      // Mobile menu toggle
      $('.menus_icon').click(function() {
        $('.header_wrap').toggleClass('menus-open');
      });

      // Mobile nav toggle
      $('.site-nav').click(function() {
        $('.nav').toggleClass('nav-open');
      });

      // Social links toggle (mobile)
      $('.m-social-links').click(function() {
        $('.author-links').toggleClass('is-open');
      });

      // Show/hide nav on scroll
      var lastScrollTop = 0;
      $(window).scroll(function() {
        var st = $(this).scrollTop();
        if (st > 100) {
          $('.nav-wrap').addClass('is-visible');
        } else {
          $('.nav-wrap').removeClass('is-visible');
        }
        lastScrollTop = st;
      });

      // Back to top
      $('.cd-top').click(function() {
        $('html, body').animate({scrollTop: 0}, 300);
      });

      // Smooth scroll for anchor links
      $('a[href^="#"]').click(function(e) {
        e.preventDefault();
        var target = $(this.hash);
        if (target.length) {
          $('html, body').animate({scrollTop: target.offset().top - 20}, 300);
        }
      });
    });
  </script>
</body>
</html>
